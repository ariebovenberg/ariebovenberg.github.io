title: Arie Bovenberg
baseurl: ""
url: "https://dev.arie.bovenberg.net"
# GitHub Pages' legacy builder forced UTC; make it explicit so local builds match.
timezone: UTC

include:
  - _pages

goatcounter: "https://ariebovenberg.goatcounter.com/count"
permalink: blog/:title/
markdown: kramdown
kramdown:
  toc_levels: 2..2   # {:toc} lists h2 only (see _includes/toc.html)

sass:
  sourcemap: development
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - .git
  - AGENTS.md
  - CLAUDE.md
  - script/
